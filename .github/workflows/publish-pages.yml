# Install this fixed workflow in the RESULTS repository at
# .github/workflows/publish-pages.yml. Evaluation records are never committed.
name: Publish evaluation site
run-name: Sieve Pages ${{ inputs.publication_id }}

on:
  workflow_dispatch:
    inputs:
      publication_id:
        required: true
        type: string
      source_url:
        required: true
        type: string
      sha256:
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and verify the generated site
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          python3 - <<'PY'
          import hashlib, io, os, re, tarfile, urllib.parse, urllib.request
          from pathlib import Path, PurePosixPath
          limit = 100 * 1024 * 1024
          sha = os.environ['EXPECTED_SHA']
          source = urllib.parse.urlsplit(os.environ['SOURCE_URL'])
          if (not re.fullmatch(r'[a-f0-9]{64}', sha)
                  or not re.fullmatch(r'[a-f0-9]{32}', os.environ['PUBLICATION_ID'])
                  or source.scheme != 'https' or not source.hostname
                  or source.username or source.password or source.query or source.fragment
                  or source.path != '/public/pages-artifacts/' + sha + '.tar.gz'):
              raise SystemExit('Invalid Pages snapshot request')
          with urllib.request.urlopen(source.geturl(), timeout=60) as response:
              data = response.read(limit + 1)
          if len(data) > limit or hashlib.sha256(data).hexdigest() != sha:
              raise SystemExit('Pages snapshot checksum or size mismatch')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              members = archive.getmembers()
              if len(members) > 10000 or sum(item.size for item in members) > limit:
                  raise SystemExit('Pages snapshot exceeds limits')
              names = set()
              for item in members:
                  path = PurePosixPath(item.name)
                  if (not item.isfile() or path.is_absolute() or '..' in path.parts
                          or '\\' in item.name or ':' in item.name
                          or str(path) != item.name or item.name in names):
                      raise SystemExit('Unsafe Pages snapshot entry')
                  names.add(item.name)
              if 'index.html' not in names or 'publication.json' not in names:
                  raise SystemExit('Pages snapshot is incomplete')
              Path('_site').mkdir()
              archive.extractall('_site', members=members, filter='data')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
