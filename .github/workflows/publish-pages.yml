# Install this fixed workflow in the RESULTS repository at
# .github/workflows/publish-pages.yml. Evaluation records are never committed.
name: Publish evaluation site
run-name: Sieve Pages ${{ inputs.publication_id }}

on:
  workflow_dispatch:
    inputs:
      publication_id:
        required: true
        type: string
      source_url:
        required: true
        type: string
      sha256:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Download and verify the generated site
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        run: |
          python3 - <<'PY'
          import hashlib, io, os, re, tarfile, urllib.parse, urllib.request
          from pathlib import Path, PurePosixPath
          limit = 100 * 1024 * 1024
          sha = os.environ['EXPECTED_SHA']
          source = urllib.parse.urlsplit(os.environ['SOURCE_URL'])
          if (not re.fullmatch(r'[a-f0-9]{64}', sha)
                  or not re.fullmatch(r'[a-f0-9]{32}', os.environ['PUBLICATION_ID'])
                  or source.scheme != 'https' or not source.hostname
                  or source.username or source.password or source.query or source.fragment
                  or source.path != '/public/pages-artifacts/' + sha + '.tar.gz'):
              raise SystemExit('Invalid Pages snapshot request')
          with urllib.request.urlopen(source.geturl(), timeout=60) as response:
              data = response.read(limit + 1)
          if len(data) > limit or hashlib.sha256(data).hexdigest() != sha:
              raise SystemExit('Pages snapshot checksum or size mismatch')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              members = archive.getmembers()
              if len(members) > 10000 or sum(item.size for item in members) > limit:
                  raise SystemExit('Pages snapshot exceeds limits')
              names = set()
              for item in members:
                  path = PurePosixPath(item.name)
                  if (not item.isfile() or path.is_absolute() or '..' in path.parts
                          or '\\' in item.name or ':' in item.name
                          or str(path) != item.name or item.name in names):
                      raise SystemExit('Unsafe Pages snapshot entry')
                  names.add(item.name)
              if 'index.html' not in names or 'publication.json' not in names:
                  raise SystemExit('Pages snapshot is incomplete')
              Path('_site').mkdir()
              archive.extractall('_site', members=members, filter='data')
          PY
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded artifact to appear
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request

          artifact_id = int(os.environ['ARTIFACT_ID'])
          repository = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          api = os.environ['GITHUB_API_URL']
          request = urllib.request.Request(
              f'{api}/repos/{repository}/actions/runs/{run_id}/artifacts?name=github-pages',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json'},
          )
          for delay in (0, 2, 4, 8, 16, 30):
              time.sleep(delay)
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      artifacts = json.load(response)['artifacts']
              except urllib.error.HTTPError as exc:
                  if exc.code not in {404, 429, 500, 502, 503, 504}:
                      raise
                  continue
              except (urllib.error.URLError, TimeoutError):
                  continue
              if any(item['id'] == artifact_id and not item['expired'] for item in artifacts):
                  break
          else:
              raise SystemExit('The uploaded Pages artifact did not become visible')
          PY
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
